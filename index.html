<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TABOO KIDS | English A1+/A2</title>
<style>
:root{--ink:#22304b;--purple:#7458dc;--pink:#ff719d;--blue:#5ac6e8;--yellow:#ffd66b;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Trebuchet MS',Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#ffdded 0,transparent 35%),radial-gradient(circle at 90% 80%,#d2f5ff 0,transparent 40%),#f5f0ff;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,650px);text-align:center}.eyebrow{font-size:.85rem;letter-spacing:.18em;font-weight:900;color:#6852b4}.heading{font-size:clamp(2.1rem,6vw,3.4rem);margin:7px 0 4px;font-weight:1000}.heading span{color:var(--purple)}.sub{margin:0 0 20px;color:#64708a}.top{display:flex;justify-content:space-between;align-items:center;margin:0 5px 12px;font-size:.92rem;font-weight:bold}.pill{background:white;padding:9px 15px;border-radius:99px;box-shadow:0 3px 15px #392c6d13}.card{min-height:350px;background:var(--paper);border:5px solid #fff;border-radius:32px;padding:30px 20px 25px;box-shadow:0 17px 40px #4d358c26;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.card:before{content:'';position:absolute;top:0;left:0;width:100%;height:12px;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--blue),var(--purple))}.star{position:absolute;font-size:2rem;opacity:.55}.star.a{top:26px;left:25px}.star.b{bottom:20px;right:25px}.tag{font-weight:900;color:#8a79b8;letter-spacing:.15em;font-size:.8rem}.target{font-size:clamp(2rem,8vw,3.8rem);line-height:1.12;overflow-wrap:anywhere;margin:24px 0 20px;color:#3e3285}.rule{height:2px;width:75%;background:#ece7fb;margin:0 auto 19px}.dont{font-weight:900;color:#c34e72;font-size:.9rem;letter-spacing:.13em;margin-bottom:14px}.banned{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.banned span{padding:12px 19px;border-radius:15px;background:#ffe8ef;color:#a73d63;font-weight:900;font-size:1.2rem}.instructions{margin:17px 0;color:#65718a;font-size:.94rem;min-height:23px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:17px;padding:16px 7px;font:900 1rem ui-rounded,'Trebuchet MS',Arial,sans-serif;cursor:pointer;box-shadow:0 5px 0 #00000014;transition:transform .1s,filter .1s}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #00000014}.btn:disabled{opacity:.4;cursor:not-allowed}.play{background:#b4edcf;color:#165c3b}.stop{background:#ffc2d4;color:#8d2246}.skip{background:#c8eefe;color:#145b7c}.new{margin-top:14px;background:white;color:#6751b1;border:2px solid #ddd5f8;box-shadow:none;padding:11px 25px}.footer{font-size:.75rem;color:#8186a0;margin-top:20px}.hidden{display:none}@media(max-width:450px){.card{min-height:320px;padding:25px 13px}.banned span{font-size:1.05rem;padding:10px 13px}.btn{font-size:.87rem}}
</style></head><body><main class="app"><div class="eyebrow">ENGLISH VOCABULARY GAME</div><h1 class="heading">TABOO <span>KIDS</span> ✨</h1><p class="sub">A1+/A2 · 50 words · 2 forbidden words</p><div class="top"><span class="pill" id="progress">Card 0 / 50</span><span class="pill" id="status">Ready to play 🌈</span></div><section class="card" aria-live="polite"><span class="star a">✦</span><span class="star b">★</span><div class="tag">GUESS THE WORD</div><div class="target" id="target">READY?</div><div class="rule"></div><div class="dont">🚫 DON'T SAY</div><div class="banned" id="banned"><span>Press PLAY</span></div></section><p class="instructions" id="instructions">Press PLAY to shuffle. Press STOP to freeze a card!</p><div class="controls"><button class="btn play" id="play">▶ PLAY</button><button class="btn stop" id="stop" disabled>■ STOP</button><button class="btn skip" id="skip" disabled>⏭ SKIP</button></div><div class="footer">Describe the word in English without saying the two forbidden words.</div></main>
<script>
const cards=[
['SQUIRREL','tree','nuts'],['DOLPHIN','sea','swim'],['BUTTERFLY','wings','colourful'],['TURTLE','slow','shell'],['HEDGEHOG','small','spikes'],['PARROT','bird','talk'],['WHALE','ocean','huge'],['FOREST','trees','animals'],['ISLAND','water','sea'],['DESERT','sand','hot'],
['PANCAKE','breakfast','sweet'],['CEREAL','milk','bowl'],['HONEY','bees','sweet'],['LEMONADE','drink','lemon'],['BISCUIT','sweet','tea'],['FRIDGE','cold','food'],['MIRROR','face','look'],['PILLOW','bed','head'],['SUITCASE','travel','clothes'],['WALLET','money','pocket'],
['HOMEWORK','school','teacher'],['SUBJECT','lesson','school'],['BREAK','school','rest'],['DICTIONARY','words','meaning'],['PROJECT','school','work'],['HOBBY','free','time'],['CONCERT','music','singer'],['MUSEUM','old','pictures'],['COMPETITION','win','prize'],['ADVENTURE','exciting','trip'],
['EXCITED','happy','fun'],['NERVOUS','worried','test'],['BORED','nothing','interesting'],['PROUD','happy','achievement'],['BRAVE','afraid','danger'],['LAZY','work','sleep'],['FRIENDLY','nice','people'],['POLITE','please','thank'],['CURIOUS','questions','know'],['JEALOUS','want','someone'],
['WHISPER','quiet','speak'],['SHOUT','loud','voice'],['BORROW','take','return'],['LEND','give','back'],['FORGET','remember','memory'],['CHOOSE','decide','options'],['INVITE','party','friend'],['EXPLORE','discover','place'],['ESCAPE','run','away'],['CELEBRATE','birthday','party']
];
const el=id=>document.getElementById(id);let deck=[],used=0,current=null,timer=null,spinning=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function render(card){el('target').textContent=card?card[0]:'ALL DONE! 🎉';el('banned').innerHTML='';if(card)card.slice(1).forEach(w=>{const s=document.createElement('span');s.textContent=w.toUpperCase();el('banned').appendChild(s)});else{const s=document.createElement('span');s.textContent='Great job!';el('banned').appendChild(s)}}
function update(){el('progress').textContent=`Card ${used} / ${cards.length}`;el('play').disabled=spinning||!deck.length&&current===null;el('stop').disabled=!spinning;el('skip').disabled=spinning||current===null}
function spin(){if(!deck.length){finish();return}spinning=true;el('status').textContent='Shuffling ✨';el('instructions').textContent='Press STOP to choose your word!';el('play').disabled=true;el('stop').disabled=false;el('skip').disabled=true;let index=0;timer=setInterval(()=>{render(deck[index++%deck.length])},110)}
function stop(){if(!spinning)return;clearInterval(timer);timer=null;spinning=false;const i=Math.floor(Math.random()*deck.length);current=deck.splice(i,1)[0];used++;render(current);el('status').textContent='Your turn! 🎤';el('instructions').textContent='Describe the word without using the forbidden words.';update()}
function finish(){clearInterval(timer);timer=null;spinning=false;current=null;render(null);el('status').textContent='Finished! 🏆';el('instructions').textContent='You have played all 50 cards. Great job!';update()}
function next(){if(spinning)return;if(current!==null)current=null;if(!deck.length){finish();return}spin();update()}
function reset(){clearInterval(timer);timer=null;spinning=false;deck=shuffle(cards.map(c=>[...c]));used=0;current=null;el('target').textContent='READY?';el('banned').innerHTML='<span>Press PLAY</span>';el('status').textContent='Ready to play 🌈';el('instructions').textContent='Press PLAY to shuffle. Press STOP to freeze a card!';update()}
el('play').addEventListener('click',()=>{if(!spinning)next()});el('stop').addEventListener('click',stop);el('skip').addEventListener('click',next);reset();
</script></body></html>
